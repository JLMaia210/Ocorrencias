<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4e79">
<title>Ocorrências por Concelho</title>
<style>
  :root{
    --bg:#f1f4f8;--card:#fff;--ink:#1b2430;--mute:#6b7787;--line:#dfe4ea;
    --btn:#1f4e79;--bar:#9db0c6;--warn:#c2600a;--ok:#2f7d4f;--red:#b42318;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:18px 14px calc(30px + env(safe-area-inset-bottom))}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--mute);font-size:12.5px;margin-bottom:14px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  label.l{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
  select,input[type=text]{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#f1f4f8;color:var(--ink)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
  .row>div{flex:1 1 180px;min-width:0}
  button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:8px 14px;cursor:pointer}
  button:active{opacity:.7}
  button.pri{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:600}
  button:disabled{opacity:.5}
  .inline{display:flex;gap:8px;align-items:center}
  .inline input{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#e3ebf4;border-radius:99px;padding:3px 6px 3px 10px;font-size:13px}
  .chip button{border:0;background:transparent;padding:0 4px;font-size:16px;line-height:1;color:var(--mute)}
  .ctrls{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .ctrls label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
  .kpi b{display:block;font:600 22px var(--mono)}
  .kpi span{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin-top:2px}
  .tr{display:grid;grid-template-columns:minmax(140px,40%) 1fr 28px;column-gap:14px;align-items:center;margin-bottom:7px}
  .track{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--bar);border-radius:99px}
  .tipos .c{text-align:right;font-family:var(--mono)}
  .ttl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
  .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:12.5px;margin-bottom:10px}
  .oc{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:8px;padding:9px 12px;margin-bottom:8px;display:flex;gap:12px}
  .oc.concl{border-left-color:var(--ok)}
  .oc.fim{border-left-color:#aab3be}
  .hora{font:600 14px var(--mono);padding-top:1px;white-space:nowrap}
  .body{min-width:0;flex:1}
  .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .conc{font-weight:700;font-size:15px}
  .cod{font:11px var(--mono);color:var(--mute)}
  .loc{color:var(--mute);font-size:12.5px;margin:2px 0 6px}
  .l3{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--warn);color:var(--warn)}
  .oc.concl .pill{border-color:var(--ok);color:var(--ok)}
  .oc.fim .pill{border-color:#aab3be;color:var(--mute)}
  .l3 .n{font-family:var(--mono)}
  a{color:var(--ink)}
  .empty{text-align:center;color:var(--mute);padding:26px 0}
  #erro{display:none;border-color:var(--red);color:var(--red);margin-bottom:14px}
  @media (max-width:640px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .kpi b{font-size:19px}
    h1{font-size:19px}
    .inline{flex-wrap:wrap}
    .inline input{flex:1 1 100%}
    .tr{grid-template-columns:1fr auto;row-gap:3px;margin-bottom:10px}
    .tr .track{grid-column:1/-1;grid-row:2}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ocorrências por Concelho</h1>
  <div class="sub" id="sub">Ocorrências em Portugal (serviço ANEPC, ao vivo).</div>

  <div class="panel">
    <div class="row">
      <div>
        <label class="l" for="mostrar">Mostrar</label>
        <select id="mostrar">
          <option value="curso">Só em curso</option>
          <option value="todas">Todas</option>
        </select>
      </div>
      <div style="flex:2 1 260px">
        <label class="l" for="tipo">Tipo (classificação ANEPC)</label>
        <select id="tipo"><option value="">Todos os tipos</option></select>
      </div>
    </div>

    <label class="l" for="conc">Concelhos (vazio = todos)</label>
    <div class="inline">
      <input id="conc" type="text" placeholder="Escreve e carrega Enter, ex.: Leiria" autocomplete="off" list="concs">
      <datalist id="concs"></datalist>
      <button id="add">Adicionar</button>
      <button id="clear">Limpar</button>
    </div>
    <div class="chips" id="chips"></div>

    <div class="ctrls" style="margin-top:14px">
      <button class="pri" id="refresh">Atualizar agora</button>
      <label><input type="checkbox" id="auto" checked> Atualizar sozinho a cada 60 s</label>
    </div>
    <div class="ctrls" style="margin-top:12px">
      <label><input type="checkbox" id="old"> Incluir ocorrências com mais de 10 dias</label>
      <button id="csv">Copiar CSV</button>
    </div>
  </div>

  <div class="panel" id="erro"></div>

  <div class="kpis">
    <div class="kpi"><b id="k1">–</b><span>Ocorrências</span></div>
    <div class="kpi"><b id="k2">–</b><span>Em curso</span></div>
    <div class="kpi"><b id="k3">–</b><span>Em conclusão</span></div>
    <div class="kpi"><b id="k4">–</b><span>Incêndios</span></div>
    <div class="kpi"><b id="k5">–</b><span>Operacionais ativos</span></div>
    <div class="kpi"><b id="k6">–</b><span>Meios terrestres ativos</span></div>
  </div>

  <div class="panel">
    <div class="ttl">Tipos de ocorrência</div>
    <div class="tipos" id="tipos"></div>
  </div>

  <div class="meta"><span id="mA"></span><span id="mB"></span><span id="mC"></span></div>
  <div id="lista"></div>
</div>

<script>
const BASE = "https://services-eu1.arcgis.com/VlrHb7fn5ewYhX6y/ArcGIS/rest/services/OcorrenciasSite/FeatureServer/0/query";
const PAGE = 2000, DIAS_MAX = 10, AUTO_MS = 60000, MIN_GAP = 10000;
const LS = "ocorrencias_prefs_v2";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => Number.isFinite(+v) ? +v : 0;
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();

let rows = [], lastLoad = 0, loading = false, timer = null;
let prefs = {mostrar:"curso", tipo:"", concs:[], auto:true, old:false};
try{ Object.assign(prefs, JSON.parse(localStorage.getItem(LS) || "{}")); }catch(e){}
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(prefs)); }catch(e){} };

/* ---------- dados ---------- */
async function fetchAll(){
  const out = [];
  for (let off = 0; off < 50000; off += PAGE){
    const url = `${BASE}?where=1%3D1&outFields=*&returnGeometry=false&orderByFields=ID_oc&f=geojson&resultOffset=${off}&resultRecordCount=${PAGE}`;
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error.message || "erro do servidor");
    const f = j.features || [];
    for (const x of f) out.push(x.properties);
    if (f.length < PAGE && !j.exceededTransferLimit) break;
    if (!f.length) break;
  }
  return out;
}

async function load(force){
  if (loading) return;
  if (!force && Date.now() - lastLoad < MIN_GAP) return;
  loading = true; $("refresh").disabled = true;
  try{
    rows = await fetchAll();
    lastLoad = Date.now();
    $("erro").style.display = "none";
    fillTipos(); fillConcs(); render();
  }catch(e){
    const er = $("erro");
    er.textContent = "Não foi possível obter os dados em direto (" + e.message + ")." + (rows.length ? " A mostrar os últimos dados obtidos às " + hhmmss(lastLoad) + "." : "");
    er.style.display = "block";
  }finally{
    loading = false; $("refresh").disabled = false;
  }
}

/* ---------- classificação ---------- */
function epoch(p){
  for (const k of ["DataOcorrencia","DataInicioOcorrencia"]){
    const v = p[k];
    if (typeof v === "number" && v > 1e11) return v;
  }
  return 0;
}
function estadoTxt(p){ return norm(p.EstadoOcorrencia || p.EstadoAgrupado); }
function classe(p){
  const t = norm((p.EstadoAgrupado || "") + " " + (p.EstadoOcorrencia || ""));
  if (/em conclus/.test(t)) return "conclusao";
  if (/conclus|encerr|fechad|finaliz/.test(t)) return "fim";
  return "curso";
}
const isInc = p => /incendi/.test(norm(p.Natureza));

function hhmm(p){
  if (typeof p.Hora === "string" && /^\d{1,2}:\d{2}/.test(p.Hora)) return p.Hora.slice(0,5).padStart(5,"0");
  const e = epoch(p);
  return e ? new Date(e).toLocaleTimeString("pt-PT", {hour:"2-digit", minute:"2-digit", timeZone:"Europe/Lisbon"}) : "--:--";
}
const hhmmss = t => new Date(t).toLocaleTimeString("pt-PT", {timeZone:"Europe/Lisbon"});

/* ---------- filtros ---------- */
function fillTipos(){
  const sel = $("tipo"), cur = prefs.tipo;
  const vals = [...new Set(rows.map(r => r.Natureza).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt"));
  sel.innerHTML = '<option value="">Todos os tipos</option>' + vals.map(v=>`<option>${esc(v)}</option>`).join("");
  sel.value = vals.includes(cur) ? cur : "";
}
function fillConcs(){
  const vals = [...new Set(rows.map(r => r.Concelho).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"pt"));
  $("concs").innerHTML = vals.map(v=>`<option value="${esc(v)}">`).join("");
}
function renderChips(){
  $("chips").innerHTML = prefs.concs.map((c,i)=>`<span class="chip">${esc(c)}<button data-i="${i}" aria-label="Remover">×</button></span>`).join("");
}
function addConc(){
  let v = $("conc").value.trim();
  const oficial = rows.find(r => norm(r.Concelho) === norm(v));
  if (oficial) v = oficial.Concelho;
  if (v && !prefs.concs.some(c => norm(c) === norm(v))) prefs.concs.push(v);
  $("conc").value = ""; save(); renderChips(); render();
}

function filtrar(){
  const lim = Date.now() - DIAS_MAX*86400000;
  const cs = prefs.concs.map(norm);
  let antigas = 0;
  const out = rows.filter(p => {
    if (prefs.mostrar === "curso" && classe(p) === "fim") return false;
    if (prefs.tipo && p.Natureza !== prefs.tipo) return false;
    if (cs.length && !cs.includes(norm(p.Concelho))) return false;
    const e = epoch(p);
    if (!prefs.old && e && e < lim){ antigas++; return false; }
    return true;
  });
  out.sort((a,b) => epoch(b) - epoch(a));
  return {out, antigas};
}

/* ---------- desenho ---------- */
function render(){
  const {out, antigas} = filtrar();
  $("k1").textContent = out.length;
  $("k2").textContent = out.filter(p => classe(p) === "curso").length;
  $("k3").textContent = out.filter(p => classe(p) === "conclusao").length;
  $("k4").textContent = out.filter(isInc).length;
  $("k5").textContent = out.reduce((s,p)=>s+num(p.Operacionais),0);
  $("k6").textContent = out.reduce((s,p)=>s+num(p.MeiosTerrestres),0);

  const cnt = new Map();
  for (const p of out){ const k = p.Natureza || "—"; cnt.set(k,(cnt.get(k)||0)+1); }
  const tp = [...cnt.entries()].sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],"pt")).slice(0,8);
  const max = tp.length ? tp[0][1] : 1;
  $("tipos").innerHTML = tp.length ? tp.map(([k,n]) =>
    `<div class="tr"><div class="t">${esc(k)}</div><div class="track"><i style="width:${Math.max(4, n/max*100)}%"></i></div><div class="c">${n}</div></div>`).join("")
    : '<div style="color:var(--mute)">Sem ocorrências.</div>';

  $("mA").textContent = out.length + " ocorrência" + (out.length===1?"":"s") + " · " + (prefs.concs.length ? prefs.concs.join(", ") : "todo o país");
  $("mB").textContent = antigas ? antigas + " com mais de " + DIAS_MAX + " dias ocultas" : "";
  $("mC").textContent = lastLoad ? "Verificado às " + hhmmss(lastLoad) : "";
  if (lastLoad) $("sub").textContent = "Ocorrências " + (prefs.mostrar==="curso" ? "abertas " : "") + "em Portugal a " +
    new Date(lastLoad).toLocaleString("pt-PT",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Lisbon"}).replace(",", " às") + " (serviço ANEPC, ao vivo).";

  $("lista").innerHTML = out.length ? out.map(p => {
    const c = classe(p);
    const lat = num(p.Latitude), lon = num(p.Longitude);
    const mapa = lat && lon ? `<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" rel="noopener">mapa</a>` : "";
    const local = [p.Freguesia, p.Localidade, p.Endereco].filter((v,i,a)=>v && a.indexOf(v)===i).join(" · ");
    return `<div class="oc ${c==="conclusao"?"concl":c==="fim"?"fim":""}">
      <div class="hora">${esc(hhmm(p))}</div>
      <div class="body">
        <div class="l1"><span class="conc">${esc(p.Concelho || "—")}</span><span>${esc(p.Natureza || "")}</span><span class="cod">${esc(p.CodNatureza || "")}</span></div>
        <div class="loc">${esc(local)}</div>
        <div class="l3"><span class="pill">${esc(p.EstadoOcorrencia || p.EstadoAgrupado || "")}</span>
          <span class="n">${num(p.Operacionais)} op · ${num(p.MeiosTerrestres)} veíc${num(p.MeiosAereos) ? " · " + num(p.MeiosAereos) + " aér" : ""}</span>${mapa}</div>
      </div></div>`;
  }).join("") : '<div class="empty">Sem ocorrências com estes filtros.</div>';
}

/* ---------- CSV ---------- */
async function copiarCsv(){
  const {out} = filtrar();
  const cols = ["Numero","Hora","Concelho","Freguesia","Natureza","CodNatureza","EstadoOcorrencia","Operacionais","MeiosTerrestres","MeiosAereos","Latitude","Longitude"];
  const q = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const txt = [cols.join(";"), ...out.map(p => cols.map(c => q(c==="Hora" ? hhmm(p) : p[c])).join(";"))].join("\n");
  const b = $("csv"); let ok = false;
  try{ await navigator.clipboard.writeText(txt); ok = true; }catch(e){
    try{ const t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); ok=document.execCommand("copy"); t.remove(); }catch(e2){}
  }
  b.textContent = ok ? "Copiado!" : "Não foi possível copiar";
  setTimeout(()=>b.textContent="Copiar CSV", 1800);
}

/* ---------- eventos ---------- */
function setAuto(){
  clearInterval(timer);
  if (prefs.auto) timer = setInterval(() => { if (!document.hidden) load(true); }, AUTO_MS);
}
$("mostrar").value = prefs.mostrar; $("auto").checked = prefs.auto; $("old").checked = prefs.old;
$("mostrar").onchange = e => { prefs.mostrar = e.target.value; save(); render(); };
$("tipo").onchange   = e => { prefs.tipo = e.target.value; save(); render(); };
$("old").onchange    = e => { prefs.old = e.target.checked; save(); render(); };
$("auto").onchange   = e => { prefs.auto = e.target.checked; save(); setAuto(); };
$("add").onclick = addConc;
$("conc").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); addConc(); } });
$("conc").addEventListener("change", e => { if ($("concs").querySelector(`option[value="${CSS.escape(e.target.value)}"]`)) addConc(); });
$("clear").onclick = () => { prefs.concs = []; $("conc").value = ""; save(); renderChips(); render(); };
$("chips").onclick = e => { const i = e.target.dataset.i; if (i != null){ prefs.concs.splice(+i,1); save(); renderChips(); render(); } };
$("refresh").onclick = () => load(true);
$("csv").onclick = copiarCsv;
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(false); });
window.addEventListener("pageshow", e => { if (e.persisted) load(true); });

renderChips(); setAuto(); load(true);
</script>
</body>
</html>
